<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Oq Libos ERP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23131211'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' letter-spacing='1' text-anchor='middle' fill='%23c9a76c'%3EOL%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Prata&display=swap" rel="stylesheet" />
    <script>
      // Pick the saved theme before the first paint so dark mode doesn't flash white.
      try {
        var m = localStorage.getItem('oqlibos.theme')
        var host = document.documentElement.getAttribute('data-theme')
        var system = host === 'dark' || host === 'light' ? host === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = m === 'dark' || (m !== 'light' && system)
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
